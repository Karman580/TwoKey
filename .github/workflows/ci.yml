name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: chaincode/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "services[dev]"
      - name: Lint
        run: make lint
      - name: Test
        env:
          GOTOOLCHAIN: local
        run: make test
      - name: Simulator smoke run
        run: cd services && ../.venv/bin/python -m twokey.simulator --n 100000
