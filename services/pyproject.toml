[project]
name = "twokey"
version = "0.1.0"
description = "TwoKey off-chain services: mock UPI switch, risk tiers, bank ops, mock 1930, policy simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "numpy==2.4.6",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[project.scripts]
twokey = "twokey.app:main"

[tool.setuptools]
packages = ["twokey"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
